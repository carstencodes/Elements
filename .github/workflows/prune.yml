name: Cleanup Preview NuGet Packages

on:
  schedule:
    - cron: '0 15 * * 5'  # Every Friday at 15:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  discover:
    name: Discover NuGet packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List packages
        id: list
        run: |
          packages=$(find gen src -name "*.csproj" \
            | xargs -I{} basename {} .csproj \
            | sed 's/^/HedgeCraft./' \
            | jq -Rsc '[split("\n") | .[] | select(length > 0)]')
          echo "packages=$packages" >> $GITHUB_OUTPUT

  cleanup:
    name: Delete old preview versions of ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: discover
    permissions:
      packages: write

    strategy:
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}

    steps:
      - name: Delete old preview versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.package }}
          package-type: nuget
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: 10
          delete-only-pre-release-versions: true
          delete-only-untagged-versions: true
