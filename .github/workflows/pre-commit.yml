name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,aarch64-unknown-linux-gnu
        components: rustfmt,clippy
    - uses: pre-commit/action@v3.0.1
