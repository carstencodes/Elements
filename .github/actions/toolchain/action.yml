name: Setup toolchains
description: Set toolchains for build
inputs: {}

runs:
  using: "composite"
  steps:
    - name: Setup zig
      uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1
      with:
        zig-version-file: .zigversion
        use-cache: true
    - name: Setup rust
      uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
      with:
        inherit-toolchain: true
        cache: true
    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json
