name: Setup toolchains
description: Set toolchains for build
inputs: {}

runs:
  using: "composite"
  steps:
    - name: Setup zig
      uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1
      with:
        zig-version-file: .zigversion
        use-cache: true
    - name: Setup rust
      uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1
      with:
        inherit-toolchain: true
        cache: true
    - name: Setup dotnet
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        global-json-file: global.json
