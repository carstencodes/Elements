name: Checkout & Restore
description: Checkout the repository and restore any cached dependencies
inputs:
  tool_restore:
    description: Run tool restore
    required: false
    type: bool
    default: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        clean: true
        fetch-tags: true
        submodules: false
        fetch-depth: 0
    - name: Setup toolchains
      uses: ./.github/actions/toolchain
    - name: Restore tools
      uses: ./.github/actions/tools
    - name: Cache dotnet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: dotnet-cache
      with:
        path: ${{ github.workspace }}/deps/nuget/
        key: ${{ runner.os }}-dotnet-${{ hashFiles('**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-directory-packages-props-
    - name: Restore packages
      shell: sh
      run: dotnet restore --no-http-cache --force --use-lock-file --locked-mode
