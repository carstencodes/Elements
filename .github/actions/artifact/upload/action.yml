name: Upload artifacts
description: Upload artifacts from this job
inputs:
  name:
    description: The name of the artifact to upload
    required: true
    type: string
  path:
    description: The path to upload the artifact from
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Compress artifact
      shell: sh
      run: |
        mkdir -p ${{ runner.temp }}/artifacts/
        tar -zcf ${{ runner.temp }}/artifacts/${{ inputs.name }}.tar.gz -C ${{ inputs.path }} .
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}.tar.gz
        path: ${{ runner.temp }}/artifacts/${{ inputs.name }}.tar.gz
        if-no-files-found: error
        retention-days: 7
        archive: false
