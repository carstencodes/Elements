name: Create cachable docker image
description: Pre-build the images required for building rust based parts
inputs: {}

runs:
  using: "composite"
  steps:
      - name: Setup docker image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: build/local/docker/cargo/Dockerfile
          tags: carstencodes/elements/cargo-build-cross:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Verify image exists
        shell: sh
        run: docker image ls carstencodes/elements/cargo-build-cross:ci
