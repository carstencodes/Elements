[workspace]
members = [
    "src/Elements.IO.Posix.native-assets"
]
resolver = "3"

[workspace.package]
version = "0.0.3"
authors = ["Carsten Igel", "Elements contributors"]
description = "Extension to the .NET System namespace"
documentation = "https://github.com/carstencodes/Elements"
edition = "2024"

[workspace.dependencies]
rustix = { version = "1.1.4", features=["fs", "process"] }
csbindgen = "1.9.6"

[profile.release]
opt-level = 's'  # Optimize for size.
lto = true # Link Time Optimization (LTO)
